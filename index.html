      const cleanText = text.replace(/[:!]/g, '.').trim();

        return;

    function playPuppyBark(baseFreq = 420) {
      initAudio();
      const now = audioCtx.currentTime;
      [0, 0.21].forEach((offset, idx) => {
        const t = now + offset, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        const f = idx === 0 ? baseFreq : baseFreq * 1.14;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f * 0.85, t);
        osc.frequency.exponentialRampToValueAtTime(f * 1.35, t + 0.045);
        osc.frequency.exponentialRampToValueAtTime(f * 0.65, t + 0.14);
        gain.gain.setValueAtTime(0.001, t); gain.gain.linearRampToValueAtTime(0.22, t + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.16);

      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + duration + 0.02);

      for (let i = 0; i < bs; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bs * 0.25));

    const ALL_FOODS = ['carrot', 'banana', 'fish', 'bone', 'cheese', 'honey', 'nut', 'hay', 'apple', 'leaves', 'fly', 'meat', 'flower'];
    let feedPool = shuffle(FEED_SCENARIOS), feedLocked = false;

    function playChompSound() {
      initAudio();
      [0, 0.22, 0.44].forEach(d => { playMarimba(340, 0.14, d, 0.16); playMarimba(520, 0.12, d + 0.08, 0.14); });
    }

    function initFeedRound() {
      feedLocked = false;
      if (!feedPool.length) feedPool = shuffle(FEED_SCENARIOS);
      const sc = feedPool.pop();
      speak(sc.prompt);

      const petBox = document.getElementById('hungryPetBox');
      petBox.className = 'hungry-pet-box';
      petBox.innerHTML = `<div class="pet-art" style="width:74%;height:74%;display:flex;align-items:center;justify-content:center;">${ART[sc.petId]}</div><div class="pet-mouth-badge"></div>`;

      const foodRow = document.getElementById('foodRow');
      foodRow.innerHTML = '';
      const distractors = shuffle(ALL_FOODS.filter(f => f !== sc.foodId)).slice(0, 3);
      const options = shuffle([sc.foodId, ...distractors]);

      options.forEach(fid => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = ART[fid];
        card.addEventListener('pointerdown', () => {
          if (feedLocked) return;
          if (fid === sc.foodId) {
            feedLocked = true;
            const fRect = card.getBoundingClientRect(), pRect = petBox.getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'flying-food';
            fly.innerHTML = ART[fid];
            fly.style.left = fRect.left + 'px';
            fly.style.top = fRect.top + 'px';
            document.body.appendChild(fly);
            card.style.visibility = 'hidden';

            requestAnimationFrame(() => {
              fly.style.left = (pRect.left + pRect.width / 2 - 55) + 'px';
              fly.style.top = (pRect.top + pRect.height / 2 - 35) + 'px';
              fly.style.transform = 'scale(0.35)';
            });

            setTimeout(() => {
              fly.remove();
              petBox.classList.add('eating', 'chew-anim');
              playChompSound();
              speak(sc.praise);
            }, 430);

            setTimeout(() => { if (currentScreen === 'screenFeed') initFeedRound(); }, 2500);
          } else {
            petBox.classList.remove('shake-no');
            void petBox.offsetWidth;
            petBox.classList.add('shake-no');
            playMarimba(240, 0.22, 0, 0.12);
            speak('Не-а! Попробуй другое!');
          }
        });
        foodRow.appendChild(card);
      });
    }

      const bedsEl = document.getElementById('gardenBeds');

        bed.className = 'plant-bed';
        let plantHtml = sprout;
        if (gardenStage === 1) plantHtml = tallSprout;
        else if (gardenStage === 2) plantHtml = currentHarvest[i];
        bed.innerHTML = `<div class="weather-fx ${fxType ? 'show' : ''}">${fxType === 'rain' ? rainSvg : (fxType === 'sun' ? sunSvg : '')}</div><div class="plant-art-wrap">${plantHtml}</div><div class="bed-mound"></div>`;
        bedsEl.appendChild(bed);
      }
    }

    function initGarden() { gardenStage = 0; renderGarden(); }

      initAudio(); playSoftPop();
      if (gardenStage === 0) { gardenStage = 1; renderGarden('rain'); speak('Кап-кап! Росточки подросли!'); }

    });

      initAudio();
      if (gardenStage === 1) {
        gardenStage = 2; renderGarden('sun'); playSuccessChord(); speak('Ура! Вырос новый урожай!');
